<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casework / Delivery escalations</title><style>
:root{font:15px/1.5 system-ui;background:#f4f4f1;color:#191a18}body{margin:0}header{background:#172621;color:#fff;padding:22px max(calc((100vw - 1100px)/2),24px)}header b{font-size:24px}header small{display:block;opacity:.7;letter-spacing:.12em}main{max-width:1100px;margin:32px auto;padding:0 24px}.grid{display:grid;grid-template-columns:300px 1fr;gap:18px}section{background:white;border:1px solid #dadbd4;border-radius:10px;padding:22px;margin-bottom:18px}h1{font-size:36px;line-height:1.1;margin:0 0 8px}h2{font-size:20px;margin-top:0}h3{font-size:15px;margin:22px 0 8px}small,.muted{color:#68716a}header small{color:#c8d5ce}.badge{display:inline-block;padding:4px 8px;background:#e8ece6;border-radius:4px;font-size:12px}button{background:#1b513e;color:white;border:0;border-radius:5px;padding:9px 13px;cursor:pointer;margin:6px 6px 0 0;font:inherit}button.alt{color:#1b513e;background:#e8f0e9}button.danger{background:#6c2c2c}input,textarea{box-sizing:border-box;width:100%;font:inherit;padding:9px;border:1px solid #bec5be;border-radius:5px}textarea{min-height:110px}label{display:block;margin:10px 0}li{cursor:pointer;padding:11px;border-bottom:1px solid #e7e9e5;list-style:none}ul{margin:0;padding:0}li:hover{background:#f2f5f0}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #e7e9e5}code{font-size:12px;overflow-wrap:anywhere}.notice{background:#fff6df;padding:12px;border-left:4px solid #ad822a}.ok{color:#256344}.bad{color:#9a2f2f}@media(max-width:780px){.grid{display:block}}
</style><header><small>OPERATIONS / EVIDENCE FIRST</small><b>Casework</b></header><main><h1>Webhook delivery escalations</h1><p class="muted">Investigate what the logs establish. Review every message before it reaches a support desk.</p>
<section><div class="grid"><label>Operator key<input id="key" type="password" placeholder="Local demo: local-operator"></label><label>Customer scope<input id="customer" value="acme-demo"></label></div><button onclick="load()">Open review queue</button><span id="error" class="bad"></span></section>
<div class="grid"><section><h2>Cases</h2><ul id="queue"></ul><button class="alt" onclick="loadMetrics()">View metrics</button><p id="metrics" class="muted"></p></section><section id="detail"><p>Select a case.</p></section></div></main>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let selected;
async function api(path,body){let response=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+(document.getElementById('key').value||'local-operator'),'X-Demo-Customer':document.getElementById('customer').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let data=await response.json();if(!response.ok)throw Error(data.error);return data}
async function load(){try{let rows=await api('cases');document.getElementById('queue').innerHTML=rows.map(c=>`<li onclick="show('${esc(c.id)}')"><span class="badge">${esc(c.finding)}</span><br><b>${esc(c.subject)}</b><br><small>${esc(c.status)} · ${esc(c.ticket_id)}</small></li>`).join('')||'<li>No cases</li>';document.getElementById('error').textContent=''}catch(e){document.getElementById('error').textContent=e.message}}
async function show(id){try{selected=id;let c=await api('cases/'+id),attempts=c.evidence.filter(e=>e.type==='delivery_attempt'),book=c.evidence.find(e=>e.type==='runbook');document.getElementById('detail').innerHTML=`<small>${esc(c.ticket_id)} / ${esc(c.event_id)} / ${esc(c.endpoint_id)}</small><h2>${esc(c.subject)}</h2><p class="badge">${esc(c.finding)}</p><p>${esc(c.description)}</p>${c.evidence_current?'':'<p class="notice">New delivery evidence arrived. Refresh before deciding.</p>'}<h3>Delivery evidence</h3><table><tr><th>Attempt</th><th>Time</th><th>Result</th><th>Next retry</th></tr>${attempts.map(e=>{let a=e.data;return `<tr><td><code>${esc(a.attempt_id)}</code></td><td>${esc(a.sent_at)}</td><td>${esc(a.outcome)} ${esc(a.http_status??'')}</td><td>${esc(a.next_retry_at??'—')}</td></tr>`}).join('')}</table><h3>Runbook · ${esc(book.data.title)}</h3><p>${esc(book.data.text)}</p><h3>Draft to review</h3><textarea id="message">${esc(c.draft.customer_message)}</textarea><p class="muted">Citations: ${c.draft.citations.map(esc).join(', ')}</p>${c.status==='pending_review'?`<label><input id="uncertain" type="checkbox" style="width:auto"> I reviewed uncertain evidence and the response wording</label><button onclick="decide('approve')">Approve for handoff</button><button class="danger" onclick="decide('reject')">Reject</button><button class="alt" onclick="refreshCase()">Refresh evidence</button>`:''}<h3>Audit trail</h3><ul>${c.audit.map(a=>`<li><small>${esc(a.created_at)}</small> · ${esc(a.action)} by ${esc(a.actor)}</li>`).join('')}</ul>`;document.getElementById('error').textContent=''}catch(e){document.getElementById('error').textContent=e.message}}
async function decide(decision){try{let c=await api('cases/'+selected+'/decision',{reviewer:'demo-operator',decision,final_message:document.getElementById('message').value,acknowledge_uncertainty:document.getElementById('uncertain')?.checked||false});await load();await show(c.id)}catch(e){document.getElementById('error').textContent=e.message}}
async function refreshCase(){try{await api('cases/'+selected+'/refresh',{});await show(selected)}catch(e){document.getElementById('error').textContent=e.message}}
async function loadMetrics(){try{let m=await api('metrics');document.getElementById('metrics').textContent=`${m.total} cases · ${JSON.stringify(m.status)} · mean review ${m.mean_review_seconds??'—'}s`}catch(e){document.getElementById('error').textContent=e.message}}
</script></html>
