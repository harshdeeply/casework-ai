<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casework · review queue</title><style>
body{font:16px/1.5 system-ui;background:#f5f4f0;color:#181818;margin:0}main{max-width:850px;margin:48px auto;padding:0 22px}h1{font-size:42px;margin:0}small{color:#666}section{background:white;border:1px solid #ddd;border-radius:12px;padding:22px;margin:20px 0}textarea{box-sizing:border-box;width:100%;min-height:95px;padding:12px;font:inherit}button{background:#141414;color:white;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;margin:10px 8px 0 0}button.secondary{background:white;color:#222;border:1px solid #bbb}pre{white-space:pre-wrap;overflow-wrap:anywhere}li{margin:10px 0;cursor:pointer}code{background:#eee;padding:2px 5px}
</style><main><small>FIELD DEPLOYMENT / OPERATIONS</small><h1>Casework</h1><p>Policy evidence, a draft, human approval, and an auditable delivery queue.</p>
<section><h2>New case</h2><textarea id="question">A tenant reported a leaking sink. What should I record before contacting a vendor?</textarea><br><button onclick="createCase()">Create draft</button><p id="error"></p></section>
<section><h2>Review queue</h2><ul id="queue"></ul></section><section id="detail" hidden></section></main>
<script>
const api=async(path,body)=>{let response=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let data=await response.json();if(!response.ok)throw Error(data.error);return data};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected;
async function refresh(){let cases=await api('cases');document.getElementById('queue').innerHTML=cases.map(c=>`<li onclick="show('${c.id}')"><code>${esc(c.status)}</code> ${esc(c.question)}</li>`).join('')||'<li>No cases yet</li>'}
async function createCase(){try{let c=await api('cases',{question:document.getElementById('question').value});await refresh();await show(c.id);document.getElementById('error').textContent=''}catch(e){document.getElementById('error').textContent=e.message}}
async function show(id){selected=id;let c=await api('cases/'+id),p=await api('policy');let refs=c.draft.citations.map(id=>p.find(x=>x.id===id)).filter(Boolean);let node=document.getElementById('detail');node.hidden=false;node.innerHTML=`<small>${esc(c.id)} / ${esc(c.status)}</small><h2>Draft</h2><p>${esc(c.draft.answer)}</p><h3>Policy citations</h3>${refs.map(x=>`<p><b>${esc(x.id)} · ${esc(x.title)}</b><br>${esc(x.text)}</p>`).join('')||'<p>None found. Add a human answer before approval.</p>'}<h3>Reviewer answer</h3><textarea id="answer">${esc(c.draft.answer)}</textarea><br>${c.status==='pending_review'?'<button onclick="decide(\'approve\')">Approve</button><button class="secondary" onclick="decide(\'reject\')">Reject</button>':''}<h3>Audit trail</h3><pre>${esc(c.events.map(e=>`${e.created_at} ${e.action} by ${e.actor}`).join('\n'))}</pre>`}
async function decide(decision){try{let c=await api('cases/'+selected+'/decision',{decision,actor:'demo-reviewer',final_answer:document.getElementById('answer').value});await refresh();await show(c.id)}catch(e){alert(e.message)}}refresh();
</script></html>
